[project]
name = "profiler-agent"
version = "0.1.0"
description = "Agent 1 (Profiling) - LangGraph interview agent, run as its own HTTP microservice"
readme = "README.md"
authors = [
    { name = "Daniel", email = "Dan5204@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.2.3",
    "orjson",
]

[project.scripts]
profiler-agent = "profiler_agent:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
