[project]
name = "api"
version = "0.1.0"
description = "Smart AI Apply - unified API server (user + company data endpoints)"
readme = "README.md"
authors = [
    { name = "Daniel", email = "Dan5204@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "requests>=2.32.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
